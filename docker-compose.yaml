version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: prestashop_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - prestashop_network

  redis:
    image: redis:7-alpine
    container_name: prestashop_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - prestashop_network

  prestashop:
    image: prestashop/prestashop:8.1.5
    container_name: prestashop
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: prestashop
      PS_ENABLE_SSL: "0"
      PS_ERASE_DB: "0"
      PS_DEV_MODE: "1"
    ports:
      - "8081:80"
    volumes:
      - prestashop_files:/var/www/html
    healthcheck:
      # Проверяем доступность сайта
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/index.php"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    networks:
      - prestashop_network

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    environment:
      DOCKER_API_VERSION: "1.44"
    ports:
      - "4444:4444"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./browsers.json:/etc/selenoid/browsers.json:ro"  # Важно: положи сюда browsers.json!
      - "./selenoid_logs:/opt/selenoid/logs"
    command:
      - -conf
      - /etc/selenoid/browsers.json
      - -limit
      - "5"
      - -container-network
      - prestashop_network
    networks:
      - prestashop_network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid_ui
    restart: unless-stopped
    depends_on:
      - selenoid
    ports:
      - "8082:8080"  # Изменил порт, чтобы не конфликтовал с GGR, если он есть
    command: --selenoid-uri=http://selenoid:4444
    networks:
      - prestashop_network

volumes:
  mysql_data:
  redis_data:
  prestashop_files:
  selenoid_logs:

networks:
  prestashop_network:
    name: prestashop_network
    driver: bridge
