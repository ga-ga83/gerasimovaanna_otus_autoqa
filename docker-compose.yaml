version: "3.9"

services:
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_ARBITRARY: "1"
      PMA_USER: root
      PMA_PASSWORD: admin
    ports:
      - "8888:80"
    depends_on:
      mysql:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - prestashop_network

  mysql:
    image: mysql:8.0
    container_name: prestashop_mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: prestashop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - prestashop_network

  redis:
    image: redis:7-alpine
    container_name: prestashop_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - prestashop_network

  prestashop:
    image: prestashop/prestashop:8.1.5
    container_name: prestashop
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: prestashop
      DB_USER: prestashop
      DB_PASSWD: prestashop
      DB_PREFIX: ps_
      PS_INSTALL_AUTO: "1"
      PS_DOMAIN: prestashop
      PS_ENABLE_SSL: "0"
      PS_ERASE_DB: "0"
      PS_INSTALL_TIMEOUT: "600"
      PS_INSTALL_MODE: Standard
      PS_INSTALL_LANG: en
      PS_INSTALL_COUNTRY: US
      PS_DEV_MODE: "1"
      PS_LANGUAGE: "en"
      PS_COUNTRY: "US"
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: Admin123!
      PS_FOLDER_ADMIN: administration
      PS_FOLDER_INSTALL: install
      PS_REDIS_SERVER: redis
      PS_REDIS_PORT: "6379"
      PS_REDIS_DATABASE: "0"
    ports:
      - "8081:80"
    volumes:
      - prestashop_files:/var/www/html
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - prestashop_network

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    environment:
      DOCKER_API_VERSION: "1.44"
    ports:
      - "4444:4444"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./:/etc/selenoid"
      - "./selenoid_logs:/opt/selenoid/logs"
      - "./selenoid_video:/opt/selenoid/video"
    command:
      - -conf
      - /etc/selenoid/browsers.json
      - -limit
      - "5"
      - -retry-count
      - "4"
      - -container-network
      - prestashop_network
      - -video-output-dir
      - /opt/selenoid/video
      - -log-output-dir
      - /opt/selenoid/logs
    networks:
      - prestashop_network

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid_ui
    restart: unless-stopped
    depends_on:
      - selenoid
    ports:
      - "8080:8080"
    command: --selenoid-uri=http://selenoid:4444
    networks:
      - prestashop_network

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prestashop_tests
    restart: "no"
    depends_on:
      prestashop:
        condition: service_healthy
      selenoid:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      BASE_URL: http://prestashop:80/
      SELENOID_URL: http://selenoid:4444/wd/hub
    volumes:
      - ./tests:/app/tests
      - ./HW_8:/app/HW_8
      - ./conftest.py:/app/conftest.py
      - ./allure-results:/app/allure-results
    command: python -m pytest HW_8/test_prestashop_all.py --base-url=http://prestashop:80/ --browser=chrome --browser-version=128.0 --selenoid-url=http://selenoid:4444/wd/hub --headless -v --alluredir=/app/allure-results
    networks:
      - prestashop_network

  prestashop_postinstall:
    image: alpine:3.19
    container_name: prestashop_postinstall
    restart: "no"
    depends_on:
      - prestashop
    volumes:
      - prestashop_files:/var/www/html
    command: >
      sh -lc '
        apk add --no-cache curl >/dev/null 2>&1 || true;

        echo "Waiting for PrestaShop HTTP to respond...";
        until curl -fsS http://prestashop/ >/dev/null; do sleep 5; done;

        echo "Waiting for config to exist...";
        until [ -f /var/www/html/config/settings.inc.php ] || [ -f /var/www/html/app/config/parameters.php ]; do sleep 2; done;

        echo "Extra grace period...";
        sleep 15;

        echo "Removing install folders...";
        rm -rf /var/www/html/install /var/www/html/install-dev || true;

        echo "Clearing cache...";
        rm -rf /var/www/html/var/cache/* || true;

        echo "Done."
      '
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - prestashop_network

volumes:
  mysql_data:
  redis_data:
  prestashop_files:
  selenoid_logs:
  selenoid_video:

networks:
  prestashop_network:
    name: prestashop_network
    driver: bridge